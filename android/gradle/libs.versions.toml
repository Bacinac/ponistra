minSdk = "28"
targetSdk = "36"
buildTools = "37.0.0"
java = "21"
androidxCore = "1.19.1"
browserHelper = "2.7.4"
work = "2.12.0"
okhttp = "5.5.1"
junit = "6.1.3"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
browser-helper = { module = "com.google.androidbrowserhelper:androidbrowserhelper", version.ref = "browserHelper" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
